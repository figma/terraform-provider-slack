name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      HAS_SLACK_TOKEN: ${{ secrets.SLACK_TOKEN != '' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go 1.20
        uses: actions/setup-go@v7
        with:
          go-version: '1.20'
        id: go

      - name: Run Unit Tests
        run: go test -v ./... -run '^(TestProvider|TestUserGroup)'

      - name: Run Acceptance Tests
        if: github.event_name == 'push' && env.HAS_SLACK_TOKEN == 'true'
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
        run: make testacc
