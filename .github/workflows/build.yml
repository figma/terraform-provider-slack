name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go 1.20
        uses: actions/setup-go@v7
        with:
          go-version: '1.20'
        id: go

      - name: Run Tests
        run: make test

      - name: Run Acceptance Tests
        if: github.event_name == 'push'
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
        run: make testacc
